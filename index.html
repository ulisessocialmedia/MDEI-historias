<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#F4F4F2}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4C5227">
<meta name="description" content="Generador de historias de Instagram para los doctores de la red MDEI: 8 plantillas de marca listas para rellenar.">
<meta property="og:title" content="Historias MDEI">
<meta property="og:description" content="Elige el tipo de historia, escribe la idea y descarga la imagen lista para Instagram.">
<meta property="og:image" content="icon-512.png">
<meta name="robots" content="noindex">

<body>
<title>Historias MDEI</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@300;400;500;700&display=swap">
<style>
/* Layout: two columns — controls left, fixed 9:16 preview right; stacks on phones. */
:root{
  --bg:#F4F4F2; --panel:#FFFFFF; --ink:#1C1F1B; --soft:#6B6F66; --line:#DEDED8;
  --accent:#4C5227; --accent-ink:#FFFFFF; --warn:#93513B; --field:#F7F7F4;
  --radius:14px;
  --display:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15170F; --panel:#1E211A; --ink:#ECEDE4; --soft:#9CA092; --line:#2E3229;
  --accent:#AFBB73; --accent-ink:#15170F; --warn:#D79A7E; --field:#171A12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15170F; --panel:#1E211A; --ink:#ECEDE4; --soft:#9CA092; --line:#2E3229;
  --accent:#AFBB73; --accent-ink:#15170F; --warn:#D79A7E; --field:#171A12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;padding-block:28px 56px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,32px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--soft);font-size:14px;margin:6px 0 0;max-width:46ch}
.langbar{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--soft);font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
.card + .card{margin-top:18px}
h2{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 14px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px 11px;cursor:pointer;font:inherit;min-width:0}
.tpl:hover{border-color:var(--accent)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.tpl svg{flex:0 0 auto;margin-top:2px}
.tpl b{display:block;font-family:var(--display);font-weight:500;font-size:13.5px;line-height:1.25}
.tpl span{display:block;color:var(--soft);font-size:11.5px;line-height:1.3;margin-top:2px}
.field{margin-bottom:14px;min-width:0}
.field label{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.5px;color:var(--soft);margin-bottom:5px}
.count{font-variant-numeric:tabular-nums;font-size:11px}
.count.over{color:var(--warn)}
input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:14px;padding:9px 11px}
textarea{resize:vertical;min-height:72px}
input:focus-visible,textarea:focus-visible,button:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.photo{display:flex;gap:10px;align-items:center}
.photo .thumb{width:54px;height:54px;border-radius:8px;background:var(--field);border:1px dashed var(--line);flex:0 0 auto;object-fit:cover;display:block}
.btn{font:inherit;font-size:13px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;font-size:14.5px;padding:12px 18px;width:100%}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.swatches{display:flex;gap:8px}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.side{position:sticky;top:env(safe-area-inset-top,0px);min-width:0}
@media (max-width:860px){.side{position:static}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.shot{position:relative;width:100%;max-width:324px;margin:0 auto}
canvas#story{width:100%;display:block;aspect-ratio:9/16;border-radius:10px;background:#F1F0E6}
.zones{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none}
.zones i{position:absolute;left:0;right:0;height:13.02%;background:repeating-linear-gradient(45deg,rgba(28,31,27,.42) 0 6px,rgba(28,31,27,.22) 6px 12px);display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#fff;font-style:normal}
.zones i.t{top:0} .zones i.b{bottom:0}
.hintrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
.linkbtn{font:inherit;font-size:12px;color:var(--soft);background:none;border:0;border-bottom:1px solid var(--line);padding:0 0 1px;cursor:pointer}
.linkbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.hint{color:var(--soft);font-size:12px;text-align:center;margin:10px 0 0}
.hint b{color:var(--ink);font-weight:600}
.stage .actions{margin-top:14px}
.status{font-size:12.5px;color:var(--soft);margin-top:8px;text-align:center;min-height:18px}
.status.err{color:var(--warn)}
.hist{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.hitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px;min-width:0}
.hitem .meta{min-width:0;flex:1}
.hitem .meta b{display:block;font-family:var(--display);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .meta span{display:block;font-size:11.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .mini{width:22px;height:39px;border-radius:4px;flex:0 0 auto;border:1px solid var(--line)}
.ghost{color:var(--soft);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
.guide{font-size:13px;color:var(--soft);line-height:1.55}
.guide li{margin-bottom:5px}
.guide code{font-size:12px;background:var(--field);padding:1px 5px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Historias MDEI</h1>
      <p class="sub" id="subtitle">Elige el tipo de historia, escribe la idea y descarga la imagen lista para Instagram. El diseño ya está hecho.</p>
    </div>
    <div class="langbar">
      <div class="seg" role="group" aria-label="Idioma">
        <button type="button" data-lang="es" aria-pressed="true">Español</button>
        <button type="button" data-lang="it" aria-pressed="false">Italiano</button>
      </div>
    </div>
  </header>

  <div class="cols">
    <div>
      <section class="card">
        <h2 id="t-tipo">Tipo de historia</h2>
        <div class="tpls" id="tpls" role="group" aria-labelledby="t-tipo"></div>
      </section>

      <section class="card">
        <h2 id="t-contenido">Contenido</h2>
        <div id="fields"></div>
      </section>

      <section class="card">
        <h2 id="t-firma">Firma y color</h2>
        <div class="row2">
          <div class="field"><label for="f-name"><span id="l-name">Doctor/a</span></label><input type="text" id="f-name" maxlength="34"></div>
          <div class="field"><label for="f-spec"><span id="l-spec">Especialidad</span></label><input type="text" id="f-spec" maxlength="38"></div>
        </div>
        <div class="field">
          <label id="l-scheme">Esquema de color</label>
          <div class="swatches" id="schemes" role="group" aria-labelledby="l-scheme"></div>
        </div>
      </section>

      <section class="card" id="histCard">
        <h2 id="t-hist">Historias de la red</h2>
        <div id="hist" class="hist"></div>
      </section>

      <section class="card">
        <h2>Cómo funciona</h2>
        <ul class="guide" id="guide"></ul>
      </section>
    </div>

    <div class="side">
      <div class="stage">
        <div class="shot">
          <canvas id="story" width="1080" height="1920" role="img" aria-label="Vista previa de la historia"></canvas>
          <div class="zones" id="zones" hidden><i class="t" id="zt"></i><i class="b" id="zb"></i></div>
        </div>
        <div class="hintrow">
          <p class="hint" id="previewHint" style="margin:0"><b>1080 × 1920</b></p>
          <button type="button" class="linkbtn" id="zoneBtn" aria-pressed="false">Zonas de Instagram</button>
        </div>
        <div class="actions">
          <button class="btn primary" id="download">Descargar PNG</button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </div>
  </div>
</div>

/* ---------- utilidades de canvas ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,maxW){
  const out=[];
  (text||'').split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){out.push('');return;}
    let line=words[0];
    for(let i=1;i<words.length;i++){
      const t=line+' '+words[i];
      if(c.measureText(t).width>maxW){out.push(line);line=words[i];} else line=t;
    }
    out.push(line);
  });
  return out;
}
/* Texto que se encoge hasta caber en maxLines. Devuelve la y del final del bloque. */
const HAS_LS = (()=>{try{return 'letterSpacing' in document.createElement('canvas').getContext('2d');}catch(e){return false;}})();
function block(c,text,o){
  if(!text) return o.y;
  let size=o.size, lines;
  const track = (o.font===DISP && o.size>=64) ? '-0.022em' : '0px';
  if(HAS_LS) c.letterSpacing=track;
  for(;;){
    c.font=`${o.weight||400} ${size}px ${o.font||BODY}`;
    lines=wrap(c,text,o.maxW);
    if(lines.length<=(o.maxLines||99) || size<=(o.min||24)) break;
    size-=2;
  }
  if(lines.length>(o.maxLines||99)) lines=lines.slice(0,o.maxLines);
  const lh=Math.round(size*(o.lh||1.22));
  c.fillStyle=o.color; c.textAlign=o.align||'left'; c.textBaseline='alphabetic';
  let y=o.y+size*0.80;
  lines.forEach(l=>{c.fillText(l,o.x,y);y+=lh;});
  if(HAS_LS) c.letterSpacing='0px';
  return o.y+size*0.80+(lines.length-1)*lh+size*0.26;
}
function spaced(c,text,x,y,o){
  c.font=`${o.weight||500} ${o.size}px ${o.font||DISP}`; c.textBaseline='alphabetic';
  const chars=[...(text||'')], track=o.track==null?5:o.track;
  let total=0; chars.forEach(ch=>total+=c.measureText(ch).width+track);
  total=Math.max(0,total-track);
  if(o.measure) return total;
  c.fillStyle=o.color;
  let cx = o.align==='right' ? x-total : (o.align==='center'? x-total/2 : x);
  chars.forEach(ch=>{c.fillText(ch,cx,y);cx+=c.measureText(ch).width+track;});
  return total;
}
function cover(c,img,x,y,w,h,r){
  c.save(); if(r){rr(c,x,y,w,h,r);}else{c.beginPath();c.rect(x,y,w,h);} c.clip();
  const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
  c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); c.restore();
}
function ph(c,S,x,y,w,h,txt){
  c.fillStyle=S.wash; c.fillRect(x,y,w,h);
  c.strokeStyle=S.hair; c.lineWidth=2; c.setLineDash([10,10]); c.strokeRect(x+1,y+1,w-2,h-2); c.setLineDash([]);
  c.font=`400 26px ${BODY}`; c.fillStyle=S.soft; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(txt,x+w/2,y+h/2); c.textAlign='left'; c.textBaseline='alphabetic';
}
const tintCache={};
function logo(color,w){
  if(!logoImg) return null;
  const key=color+'|'+w;
  if(tintCache[key]) return tintCache[key];
  const h=Math.round(w*logoImg.height/logoImg.width);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c2=cv.getContext('2d');
  c2.drawImage(logoImg,0,0,w,h);
  c2.globalCompositeOperation='source-in'; c2.fillStyle=color; c2.fillRect(0,0,w,h);
  tintCache[key]=cv; return cv;
}

function brandRow(c,S,y){

const BLEED = {caso:'arriba', back:'total', pod:'arriba'};
const GAP  = {dato:34, caso:46};
const BAND = {caso:[700,1080], pod:[460,860]};   /* alto mín/máx de la banda de imagen */

let oc=null;
function bodyTo(o,Sc,top){
  o.clearRect(0,0,W,H);
  DRAW[state.tpl](o,Sc,state.v,false,top);
  let bottom=top;
  try{
    const h=H-top, d=o.getImageData(0,top,W,h).data;
    for(let row=h-1; row>=0; row-=2){
      let hit=false; const base=row*W*4;
      for(let x=3; x<W*4; x+=12){ if(d[base+x]>8){hit=true;break;} }
      if(hit){bottom=top+row;break;}
    }
  }catch(e){ bottom=C_BOT; }
  return bottom;
}

function render(){
  const S=SCHEMES[state.scheme];
  const Sc = BLEED[state.tpl]==='total' ? Object.assign({},S,ONPIC) : S;
  const bleed=BLEED[state.tpl], gap=GAP[state.tpl]||54, bh=brandH();
  if(!oc){oc=document.createElement('canvas');oc.width=W;oc.height=H;}
  const o=oc.getContext('2d');

  /* 1 · altura real del cuerpo */
  const bodyH = bodyTo(o,Sc,0);

  /* 2 · dónde se posa la marca */
  let by = BRAND_Y;
  const band = BAND[state.tpl];
  if(bleed==='arriba' && band && (state.tpl!=='pod' || state.img.img)){
    state._ph = Math.max(band[0], Math.min(band[1], C_BOT - bodyH - gap - bh - 46));
    by = state._ph + 46;
  }

  /* 3 · composición */
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=S.bg; ctx.fillRect(0,0,W,H);
  if(bleed) DRAW[state.tpl](ctx,Sc,state.v,true,0);
  const bEnd = brandRow(ctx,Sc,by);
  const top = Math.round(bEnd + gap);
  const bottom = bodyTo(o,Sc,top);
  ctx.drawImage(oc,0,Math.max(0,Math.round(C_BOT-bottom)));
  foot(ctx,Sc);
}

function buildTpls(){
  const box=$('#tpls'); box.innerHTML='';
  ORDER.forEach(id=>{
    const t=T[id];
    const b=document.createElement('button');
    b.type='button'; b.className='tpl'; b.setAttribute('aria-pressed', id===state.tpl);
    b.innerHTML=icon(ICONS[t.icon])+`<span style="min-width:0"><b>${t.name[state.lang]}</b><span>${t.desc[state.lang]}</span></span>`;
    b.onclick=()=>{state.tpl=id;loadExample();buildTpls();buildFields();updateHint();render();};
    box.appendChild(b);
  });
}

function buildFields(){
  const box=$('#fields'); box.innerHTML='';
  tpl().fields.forEach(f=>{
    const d=document.createElement('div'); d.className='field';
    const id='fld-'+f.k;
    if(f.t==='image'){
      d.innerHTML=`<label for="${id}">${f.l[state.lang]}</label>
        <div class="photo"><img class="thumb" id="th-${f.k}" alt="">
        <button type="button" class="btn" id="btn-${f.k}">${state.img[f.k]?L().change:L().upload}</button>
        <input type="file" accept="image/*" id="${id}" class="sr"></div>`;
      box.appendChild(d);
      const inp=d.querySelector('#'+id), th=d.querySelector('#th-'+f.k);
      if(state.img[f.k]) th.src=state.img[f.k].src;
      d.querySelector('#btn-'+f.k).onclick=()=>inp.click();
      inp.onchange=e=>{
        const file=e.target.files&&e.target.files[0]; if(!file) return;
        const url=URL.createObjectURL(file); const im=new Image();
        im.onload=()=>{state.img[f.k]=im;th.src=url;d.querySelector('#btn-'+f.k).textContent=L().change;state.example=false;updateHint();render();};
        im.src=url;
      };
      return;
    }
    const val=state.v[f.k]||'';
    d.innerHTML=`<label for="${id}">${f.l[state.lang]}<span class="count" id="c-${f.k}">${val.length}/${f.max}</span></label>`+
      (f.t==='area'?`<textarea id="${id}" maxlength="${f.max}">${val.replace(/</g,'&lt;')}</textarea>`
                   :`<input type="text" id="${id}" maxlength="${f.max}" value="${val.replace(/"/g,'&quot;')}">`);
    box.appendChild(d);
    const el=d.querySelector('#'+id), cn=d.querySelector('#c-'+f.k);
    el.oninput=()=>{state.v[f.k]=el.value;cn.textContent=el.value.length+'/'+f.max;
      cn.classList.toggle('over',el.value.length>=f.max);state.example=false;updateHint();render();};
  });
}

function buildSchemes(){
  const box=$('#schemes'); box.innerHTML='';
  Object.keys(SCHEMES).forEach(k=>{
    const b=document.createElement('button');
    b.type='button'; b.className='swatch'; b.style.background=SCHEMES[k].sw;
    b.title=SCHEME_NAMES[state.lang][k]; b.setAttribute('aria-label',SCHEME_NAMES[state.lang][k]);
    b.setAttribute('aria-pressed',k===state.scheme);
    b.onclick=()=>{state.scheme=k;buildSchemes();render();};
    box.appendChild(b);
  });
}

function updateHint(){ $('#previewHint').innerHTML = state.example ? L().hintEx : L().hint; }
$('#zoneBtn').onclick=()=>{
  const z=$('#zones'); z.hidden=!z.hidden;
  $('#zoneBtn').setAttribute('aria-pressed', !z.hidden);
};

function applyLang(){
  const u=L();
  $('#subtitle').textContent=u.sub;
  $('#t-tipo').textContent=u.tipo; $('#t-contenido').textContent=u.cont; $('#t-firma').textContent=u.firma;
  $('#t-hist').textContent=u.hist; $('#l-name').textContent=u.name; $('#l-spec').textContent=u.spec;
  $('#l-scheme').textContent=u.scheme; $('#download').textContent=u.dl;
  $('#zoneBtn').textContent=u.zones; $('#zt').textContent=u.ztop; $('#zb').textContent=u.zbot;
  $('#guide').innerHTML=u.guide.map(g=>`<li>${g}</li>`).join('');
  document.querySelectorAll('.card h2')[5] && (document.querySelectorAll('.card h2')[5].textContent=u.como);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===state.lang));
  buildTpls(); buildFields(); buildSchemes(); updateHint(); renderHist();
}

document.querySelectorAll('[data-lang]').forEach(b=>{
  b.onclick=()=>{ state.lang=b.dataset.lang; if(state.example) loadExample(); applyLang(); render(); save('mdei_lang',state.lang); };
});

/* firma persistente por navegador */
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
$('#f-name').oninput=e=>{state.doc.name=e.target.value;save('mdei_name',e.target.value);render();};
$('#f-spec').oninput=e=>{state.doc.spec=e.target.value;save('mdei_spec',e.target.value);render();};

/* ---------- historial compartido ---------- */
let histDocs=[];
function renderHist(){
  const box=$('#hist');
  if(!histDocs.length){box.innerHTML=`<div class="ghost">${L().empty}</div>`;return;}
  box.innerHTML='';
  histDocs.forEach(h=>{
    const d=h.data()||{}; const t=T[d.t]; if(!t) return;
    const row=document.createElement('div'); row.className='hitem';
    const mini=document.createElement('div'); mini.className='mini';
    mini.style.background=(SCHEMES[d.scheme]||SCHEMES.crema).sw;
    const meta=document.createElement('div'); meta.className='meta';
    const first=(t.fields.find(f=>f.t!=='image')||{}).k;
    const title=(d.v&&d.v[first])||t.name[state.lang];
    const when=d.at?new Date(d.at).toLocaleDateString(state.lang==='es'?'es-ES':'it-IT',{day:'numeric',month:'short'}):'';
    meta.innerHTML=`<b></b><span></span>`;
    meta.querySelector('b').textContent=title;
    meta.querySelector('span').textContent=[t.name[state.lang],d.doctor||'',when].filter(Boolean).join(' · ');
    const use=document.createElement('button'); use.className='btn'; use.textContent=L().reuse;
    use.onclick=()=>{
      state.tpl=d.t; state.scheme=d.scheme||'crema'; state.v=Object.assign({},d.v||{}); state.img={}; state.example=false;
      buildTpls(); buildFields(); buildSchemes(); updateHint(); render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    row.append(mini,meta,use);
    if(d.by && uid && d.by===uid){
      const del=document.createElement('button'); del.className='btn'; del.textContent='×';
      del.setAttribute('aria-label',L().del);
      del.onclick=()=>{ if(db) db.collection('historias').doc(h.id).delete().catch(()=>{}); };
      row.append(del);
    }
    box.appendChild(row);
  });
}

async function initDb(){
  try{
    user = await useCap('user');
    db   = await useCap('db');
    if(user){ uid = await user.id().catch(()=>null); canWrite = await Promise.resolve(user.can('data.write')).catch(()=>null); }
    if(canWrite===false) setStatus(L().nowrite,false);
    if(!db){ const h=$('#histCard'); if(h) h.hidden=true; return; }
    db.collection('historias').orderBy('at','desc').limit(40)
      .onSnapshot(s=>{histDocs=s.docs;renderHist();},()=>{});
  }catch(e){ const h=$('#histCard'); if(h) h.hidden=true; }
}

async function saveHist(){
  if(!db || canWrite===false) return false;
  try{
    const v=Object.assign({},state.v);
    await db.collection('historias').add({
      t:state.tpl, lang:state.lang, scheme:state.scheme, v,
      doctor:state.doc.name||'', by:uid||'', at:new Date().toISOString()
    });
    return true;
  }catch(e){return false;}
}

/* ---------- descarga ---------- */
function setStatus(msg,err){const s=$('#status');s.textContent=msg||'';s.classList.toggle('err',!!err);}
$('#download').onclick=async()=>{
  const btn=$('#download'); btn.disabled=true; setStatus('');
  try{
    render();
    const blob=await new Promise(r=>$('#story').toBlob(r,'image/png'));
    const slug=(state.doc.name||'mdei').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mdei';
    const filename=`historia-${state.tpl}-${slug}.png`;
    const dl=await useCap('downloads');
    if(dl){ await dl.save({filename, data:blob}); }
    else {
      const url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=filename; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
    const ok=await saveHist();
    setStatus(ok?L().dlok+' '+L().saved:L().dlok,false);
  }catch(e){
    setStatus(e && e.code==='declined' ? L().dldecl : (L().dlno), e && e.code!=='declined');
  }
  btn.disabled=false;
};

/* ---------- arranque ---------- */
(async function boot(){
  state.lang = load('mdei_lang')==='it' ? 'it' : 'es';
  state.doc.name = load('mdei_name')||'';
  state.doc.spec = load('mdei_spec')||'';
  $('#f-name').value=state.doc.name; $('#f-spec').value=state.doc.spec;
  loadExample();
  applyLang();
  render();

  const im=new Image();
  im.onload=()=>{logoImg=im;render();};
  im.src=LOGO_URI;

  try{
    await document.fonts.load(`700 80px "DM Sans"`);
    await document.fonts.load(`500 40px "DM Sans"`);
    await document.fonts.load(`400 32px "Manrope"`);
    await document.fonts.ready;
  }catch(e){}
  fontsReady=true; render();

  initDb();
})();
</script>
